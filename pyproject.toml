[project]
name = "cambodia-airflow-pipeline"
version = "0.1.0"
description = "Cambodia data pipeline practicing Apache Airflow orchestration"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow==3.3.2",
    "dbt-postgres>=1.11.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
